[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src"]
extend-exclude = ["node_modules", "staticfiles", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ"]
ignore = ["E501", "DJ001", "DJ012", "B904"]

[tool.ruff.lint.isort]
known-first-party = ["backoffice", "billing", "quotes", "catalog", "config", "leads", "pages"]
