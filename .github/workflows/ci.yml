name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check src
      - run: ruff format --check src
      - name: Migrations are up to date
        run: python src/manage.py makemigrations --check --dry-run --settings=config.settings.test
      - name: Deployment checks
        run: python src/manage.py check --deploy --fail-level WARNING --settings=config.settings.production
        env:
          SECRET_KEY: ci-only-secret-key-that-is-long-enough-and-random-0123456789
          ALLOWED_HOSTS: funera.co.za
          SITE_URL: https://funera.co.za
      - name: Tests
        working-directory: src
        run: |
          coverage run manage.py test --settings=config.settings.test
          coverage report --fail-under=85
  css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci && npm run css:build
      - name: Built stylesheet is committed and current
        run: git diff --exit-code src/static/css/app.css
  docker:
    runs-on: ubuntu-latest
    needs: [test, css]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t funera-web:ci .
