<form method="get" class="mb-4 flex flex-wrap items-end gap-3">
  <div><label class="label" for="q">Search</label><input class="field !w-64" type="search" id="q" name="q" value="{{ q }}" placeholder="Name, business or e-mail"></div>
  {% if statuses %}<div><label class="label" for="status">Status</label><select class="field" id="status" name="status"><option value="">All</option>{% for key, label in statuses %}<option value="{{ key }}" {% if key == status %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>{% endif %}
  <button type="submit" class="btn-primary">Filter</button>
  {% if q or status %}<a class="btn-outline" href="?">Clear</a>{% endif %}
</form>
