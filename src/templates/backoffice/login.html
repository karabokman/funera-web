{% extends "backoffice/base.html" %}
{% block staff %}
<div class="mx-auto mt-10 max-w-md">
  <h1 class="h-section">Staff sign-in</h1>
  <form method="post" class="card mt-6 space-y-5" novalidate>{% csrf_token %}
    {% if form.non_field_errors %}<p class="rounded-xl bg-red-50 p-3 text-sm text-red-800" role="alert">Wrong username or password, or the account is locked after too many attempts.</p>{% endif %}
    <div><label class="label" for="{{ form.username.id_for_label }}">Username</label><input class="field" type="text" name="username" id="{{ form.username.id_for_label }}" autocomplete="username" autofocus required></div>
    <div><label class="label" for="{{ form.password.id_for_label }}">Password</label><input class="field" type="password" name="password" id="{{ form.password.id_for_label }}" autocomplete="current-password" required></div>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="btn-primary btn-lg w-full">Sign in</button>
  </form>
</div>
{% endblock %}
