{% load static %}
<header class="sticky top-0 z-40 border-b border-line bg-white/90 backdrop-blur">
  <div class="container-page flex h-16 items-center justify-between gap-4">
    <a href="{% url 'pages:home' %}" class="flex shrink-0 items-center" aria-label="{{ site.name }} home">
      <img src="{% static 'img/logo-compact.png' %}" alt="{{ site.name }}" width="686" height="257" class="h-10 w-auto">
    </a>
    <nav class="hidden items-center gap-1 md:flex" aria-label="Main">
      <a class="nav-link" href="{% url 'pages:features' %}" {% if request.resolver_match.url_name == 'features' %}aria-current="page"{% endif %}>Features</a>
      <a class="nav-link" href="{% url 'pages:pricing' %}" {% if request.resolver_match.url_name == 'pricing' %}aria-current="page"{% endif %}>Pricing</a>
      <a class="nav-link" href="{% url 'pages:security' %}" {% if request.resolver_match.url_name == 'security' %}aria-current="page"{% endif %}>Security</a>
    </nav>
    <div class="flex items-center gap-2">
      <a class="nav-link hidden lg:inline-flex" href="{% url 'billing:portal' %}">Client login</a>
      <a class="btn-primary hidden sm:inline-flex" href="{% url 'leads:contact' %}">Book a demo</a>
      <button type="button" class="inline-flex h-11 w-11 items-center justify-center rounded-xl border border-line md:hidden" data-menu-toggle aria-expanded="false" aria-controls="mobile-menu" aria-label="Menu">
        {% include "components/icon.html" with name="menu" %}
      </button>
    </div>
  </div>
  <div id="mobile-menu" class="hidden border-t border-line bg-white md:hidden" data-menu>
    <nav class="container-page flex flex-col gap-1 py-3" aria-label="Mobile">
      <a class="nav-link py-3 text-base" href="{% url 'pages:features' %}">Features</a>
      <a class="nav-link py-3 text-base" href="{% url 'pages:pricing' %}">Pricing</a>
      <a class="nav-link py-3 text-base" href="{% url 'pages:security' %}">Security and POPIA</a>
      <a class="nav-link py-3 text-base" href="{% url 'billing:portal' %}">Client login</a>
      <a class="btn-primary mt-2" href="{% url 'leads:contact' %}">Book a demo</a>
    </nav>
  </div>
</header>
