<div class="mt-8 divide-y divide-line rounded-2xl border border-line bg-white">
  {% for question, answer in faq %}
  <details class="group p-5">
    <summary class="flex cursor-pointer items-center justify-between gap-4 text-left font-semibold text-ink">{{ question }}<span class="text-brand transition group-open:rotate-45" aria-hidden="true">+</span></summary>
    <p class="mt-3 leading-relaxed text-slate-600">{{ answer }}</p>
  </details>
  {% endfor %}
</div>
